[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nicto-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Víctor Vázquez", email = "victorvazrod@ugr.es" },
    { name = "Fernando Valdivia", email = "f.valdivia@ugr.es" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "grpclib[protobuf]>=0.4.9",
    "httpx>=0.28.1",
    "nicto-apis",
    "pydantic>=2.13.4",
    "pydantic-extra-types>=2.11.1",
    "sqlalchemy[asyncio]>=2.0.51",
]

[project.scripts]
nicto = "nicto.core:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nicto"]

[tool.uv.sources]
nicto-apis = { workspace = true }

[dependency-groups]
dev = []
