syntax = "proto3";

package nicto.scheduling.v1;

service SchedulingService {
    rpc AddStream (AddStreamRequest) returns (AddStreamResponse);
}

message AddStreamRequest {
    string src_mac_address = 1;
    string dst_mac_address = 2;
    int64 max_frame_size = 3;
    int64 max_interval_frames = 4;
    int64 interval = 5;
    int64 max_latency = 6;
}

message AddStreamResponse {
    int64 vlan = 1;
    int64 priority = 2;
    int64 start_time = 3;
    Status status = 4;

    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_SUCCESS = 1;
        STATUS_UNFEASIBLE = 2;
        STATUS_PORT_NOT_FOUND = 3;
    }
}
