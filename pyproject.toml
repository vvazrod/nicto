[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nicto"
version = "0.1.0"
description= "A web service for automatic stream scheduling in TAS-enabled networks"
authors = [
    { name = "Víctor Vázquez", email = "victorvazrod@ugr.es" },
    { name = "Fernando Valdivia del Rosal", email = "f.valdivia@ugr.es" },
    { name = "Begoña del Pino", email = "bpino@ugr.es" }
]
requires-python = ">=3.12"
license = "EUPL-1.2"
license-files = ["LICENCE"]
dependencies = [
    "aiofiles>=24.0.0",
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.2",
    "pydantic>=2.14.3",
    "pydantic-extra-types>=2.11.1",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
epics = [
    "numpy>=2.0.0",
    "p4p>=4.2.0",
]

[project.scripts]
nicto = "nicto.main:start"

[dependency-groups]
dev = [
    "hatchling>=1.31.0",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "mypy>=2.3.0",
    "polars>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.16.0",
    "seaborn>=0.13.2",
    "types-aiofiles>=25.1.0.20261107",
    "types-seaborn>=0.13.2.20261115",
]

[tool.mypy]
explicit_package_bases = true
mypy_path = ["src", "."]

[[tool.mypy.overrides]]
module = ["p4p.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "D100",
    "D104",
    "D107",
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**/*.py" = [
    "INP001",  # implicit-namespace-package
    "T201",  # print
]
"tests/**/*.py" = [
    "INP001",  # implicit-namespace-package
    "S101",  # assert
]
